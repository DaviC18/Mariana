services:
  postgres:
    image: postgres:18.6
    container_name: mariana-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mariana
      POSTGRES_PASSWORD: mariana
      POSTGRES_DB: mariana
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
